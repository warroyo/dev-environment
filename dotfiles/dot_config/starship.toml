# Starship prompt — applies on all three machines (server, personal Air,
# work MacBook Pro). One config, identical prompt everywhere.
#
# Glyphs below assume a Nerd Font (the bootstrap scripts install MesloLGS and
# the Ghostty config selects it). If you ever use a terminal without it —
# the Comet Pro KVM console, a recovery shell — the prompt still works, the
# icons just render as boxes.

add_newline = true
format = """
$hostname$directory$git_branch$git_status$cmd_duration
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold yellow"
# [!] modified  [?] untracked  [+] staged  [»] renamed  [x] deleted
# [⇡/⇣] ahead/behind remote
format = '([$all_status$ahead_behind]($style) )'

[cmd_duration]
# Only shown when a command took a noticeable amount of time.
min_time = 2000
style = "bold yellow"
format = "took [$duration]($style) "

# The hostname matters here: this setup is explicitly multi-machine, and
# knowing whether you're on the server or a laptop prevents running the wrong
# thing in the wrong place. Only shown over SSH, where it's ambiguous.
[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "bold dimmed green"

[username]
show_always = false
