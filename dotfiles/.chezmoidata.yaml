# Defaults for this source directory. Nothing machine-specific or identifying
# belongs here — real per-machine values live OUTSIDE the repo:
#
#   ~/.config/chezmoi/chezmoi.toml   role (written by provision/*-bootstrap.sh)
#   ~/.zsh.local                     shell overrides
#   ~/.gitconfig.local               git identity
#   ~/.secrets/*                     tokens and credentials
#
# This replaced hostname matching. Hostnames were both identifying (they had to
# be committed) and fragile — chezmoi's .chezmoi.hostname strips the domain and
# macOS reports mixed case, which silently broke matching twice.

# Role decides which layers apply. Overridden per machine in
# ~/.config/chezmoi/chezmoi.toml under [data].
#
#   server     — the always-on Claude Code host
#   personal   — full client (personal MacBook Air)
#   work       — restricted client: general layer only, never Claude Code
#   restricted — DEFAULT. Same restrictions as "work".
#
# The default is deliberately the most restrictive value, so this FAILS CLOSED:
# a machine that never declared a role gets the general layer only. The old
# hostname scheme failed open — an unmatched hostname received the full Claude
# Code layer, which is exactly backwards for a rule whose whole job is keeping
# Claude Code off one machine.
role: "restricted"

# The server's Tailscale hostname, used for the `Host claude-server` SSH entry.
# Generic and functionally required; override in ~/.config/chezmoi/chezmoi.toml
# if yours differs.
serverHost: "ubuntu-home"
