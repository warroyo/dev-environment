# Single source of truth for the hostnames used by the templates in this
# source directory (dot_zshrc.tmpl, private_dot_ssh/private_config.tmpl,
# .chezmoiignore.tmpl). Change a hostname in exactly one place: here.
#
# PLACEHOLDER — replace before running chezmoi on the work laptop:
#   workLaptop   run `hostname` on that machine, paste the exact output
# Until it's replaced, chezmoi will never match that host, so the
# Claude-specific exclusions in .chezmoiignore.tmpl won't apply there and
# the Claude scripts WILL be installed on it.
#
# Note: git identity is NOT here — it's the same on every machine, so
# dot_gitconfig is a plain (non-templated) file.
# Write these lowercase and WITHOUT any domain suffix. chezmoi's
# .chezmoi.hostname excludes the domain, so macOS's "Wills-MacBook-Air.local"
# arrives as "Wills-MacBook-Air". The templates normalize both sides
# (lowercase + strip .local) before comparing, so case here doesn't matter,
# but keeping them lowercase makes the intent obvious.
hostnames:
  server: "ubuntu-home"
  personalAir: "wills-macbook-air"
  workLaptop: "REPLACE_WITH_WORK_LAPTOP_HOSTNAME"
