# Single source of truth for per-machine values used by the templates in this
# source directory (dot_zshrc.tmpl, dot_ssh/config.tmpl, dot_gitconfig.tmpl,
# .chezmoiignore.tmpl). Change a value in exactly one place: here.
#
# PLACEHOLDERS — replace before running chezmoi on the work laptop:
#   hostnames.workLaptop  run `hostname` on that machine
#   emails.work           your work email address
# Until hostnames.workLaptop is replaced, chezmoi will never match that host,
# so the Claude-specific exclusions in .chezmoiignore.tmpl won't apply there.
hostnames:
  server: "ubuntu-home"
  personalAir: "wills-MacBook-Air.local"
  workLaptop: "REPLACE_WITH_WORK_LAPTOP_HOSTNAME"

# git author identity, selected by hostname in dot_gitconfig.tmpl — commits
# made on the work laptop must not be authored with a personal address.
emails:
  personal: "willarroyoa@gmail.com"
  work: "REPLACE_WITH_WORK_EMAIL"

git:
  name: "Will Arroyo"
