# Single source of truth for machine hostnames used by the templates in this
# source directory (dot_zshrc.tmpl, dot_ssh/config.tmpl, .chezmoiignore.tmpl).
# Change a hostname in exactly one place: here.
#
# workLaptop is a PLACEHOLDER — replace it with the work MacBook Pro's real
# hostname (run `hostname` on that machine) before running chezmoi on it.
# Until it's replaced, chezmoi will never match that host, so the
# Claude-specific exclusions in .chezmoiignore.tmpl silently won't apply.
hostnames:
  server: "ubuntu-home"
  personalAir: "wills-MacBook-Air.local"
  workLaptop: "REPLACE_WITH_WORK_LAPTOP_HOSTNAME"
