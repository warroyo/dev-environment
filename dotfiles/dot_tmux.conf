# dev-environment tmux config.
# Applies on every machine that runs tmux locally (mainly the server, since
# that's where the persistent claude-main session lives). Plugin management
# is via TPM (https://github.com/tmux-plugins/tpm) rather than a hand-rolled
# install script — see provision/server-bootstrap.sh for the tpm clone step.

# ---- General behavior ----
set -g mouse on                # scroll-back and pane select/resize with the trackpad/mouse
set -g history-limit 50000
set -g base-index 1            # windows/panes start at 1, not 0 (0 is awkward to reach)
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10          # don't lag on Escape (vim, etc.)

# ---- True color over SSH ----
# TERM inside tmux becomes tmux-256color, and SSH doesn't forward COLORTERM,
# so programs inside tmux otherwise think they only have 256 colors. Assert
# RGB support explicitly and force COLORTERM so colors match what you'd see
# outside tmux.
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",tmux-256color:Tc"
set-environment -g COLORTERM "truecolor"

# ---- Shift-Enter / modified keys ----
# tmux collapses modified key sequences (e.g. Shift-Enter) by default, which
# is why Shift-Enter submits instead of inserting a newline in some apps.
# extended-keys passes the real key sequence through.
set -s extended-keys on
set -as terminal-features "*:extkeys"

# ---- Keybindings (custom — see docs/tmux-cheatsheet.md) ----
# Reload this config without restarting the session.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Split panes in the current pane's working directory, with more intuitive
# keys than the tmux defaults (" and %).
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ---- Plugins (managed by tpm) ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-save session state frequently and auto-restore on tmux server start,
# so a server reboot brings the claude-main session's layout back with no
# manual steps.
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# Keep this line at the very bottom of the file (tpm requirement).
run '~/.tmux/plugins/tpm/tpm'
