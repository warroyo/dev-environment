- name: Create the models directory
  ansible.builtin.file:
    path: "{{ inference_models_dir }}"
    state: directory
    mode: "0755"

# `hf download` resumes partial files, and the .complete marker skips a model
# already fetched.
- name: Download models (about 100 GiB for Flash-Next; runs in the background)
  ansible.builtin.shell:
    # One --include per pattern. `--include A B` makes hf read B as a filename
    # to fetch, and named files override --include, so only B arrives.
    cmd: >-
      hf download {{ item.repo | quote }}
      --revision {{ item.revision | quote }}
      --repo-type model
      {% for p in item.include %}--include {{ p | quote }} {% endfor %}
      --local-dir {{ (inference_models_dir ~ '/' ~ item.name) | quote }}
      && echo {{ item.revision | quote }} > {{ (inference_models_dir ~ '/' ~ item.name ~ '/' ~ marker) | quote }}
    creates: "{{ inference_models_dir }}/{{ item.name }}/{{ marker }}"
  vars:
    # The marker covers the revision and the patterns, so changing either
    # downloads again (hf skips files it already has).
    marker: ".complete-{{ item.revision }}-{{ (item.include | join(',')) | hash('sha1') | truncate(8, True, '') }}"
  loop: "{{ inference_models }}"
  loop_control:
    label: "{{ item.name }}"
  async: "{{ (inference_model_download_hours | int) * 3600 }}"
  poll: 30
  # Ansible refuses async tasks in check mode.
  when: not ansible_check_mode
