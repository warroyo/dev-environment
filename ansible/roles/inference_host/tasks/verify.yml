- name: Read GTT and GPU state
  ansible.builtin.shell: |
    set -o pipefail
    echo "ttm.pages_limit: $(cat /sys/module/ttm/parameters/pages_limit)"
    for f in /sys/class/drm/card*/device/mem_info_gtt_total; do
      echo "GTT total: $(( $(cat "$f") / 1073741824 )) GiB"
    done
    echo "MemTotal: $(awk '/MemTotal/ {printf "%d GiB", $2/1048576}' /proc/meminfo)"
    command -v vulkaninfo >/dev/null && vulkaninfo --summary 2>/dev/null | awk -F= '/deviceName/ {print "Vulkan:" $2}'
    command -v llama-server >/dev/null && echo "llama.cpp: $(readlink -f "$(command -v llama-server)")"
    systemctl is-active gufo.service 2>/dev/null | sed 's/^/gufo: /' || true
  register: inference_state
  args:
    executable: /bin/bash
  changed_when: false
  check_mode: false

- name: Inference host state
  ansible.builtin.debug:
    msg: "{{ inference_state.stdout_lines }}"

- name: Reboot pending
  ansible.builtin.debug:
    msg: >-
      Kernel parameters changed but are not live yet. Reboot the box
      (ssh -t <host>-admin sudo reboot) or re-run with -e inference_reboot=true.
  when: inference_reboot_pending | default(false) | bool
