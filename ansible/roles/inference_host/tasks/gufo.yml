- name: Check for the pinned Gufo image
  ansible.builtin.command: podman image exists {{ gufo_image | quote }}
  register: gufo_image_present
  changed_when: false
  failed_when: false
  check_mode: false

- name: Pull the pinned Gufo image
  ansible.builtin.command: podman pull {{ gufo_image | quote }}
  when: gufo_image_present.rc != 0
  changed_when: true

# Gufo has no authentication, so it listens on the tailnet address only, never
# the LAN. The tailnet policy decides who reaches it.
- name: Read the tailnet address
  ansible.builtin.command: tailscale ip -4
  register: gufo_tailnet_ip
  changed_when: false
  check_mode: false

- name: Write the Gufo quadlet
  ansible.builtin.template:
    src: gufo.container.j2
    dest: /etc/containers/systemd/gufo.container
    mode: "0644"
  when: gufo_model | length > 0
  notify: Reload systemd

- name: Load the quadlet before starting it
  ansible.builtin.meta: flush_handlers

- name: Start or stop Gufo to match gufo_enabled
  ansible.builtin.systemd_service:
    name: gufo.service
    state: "{{ 'started' if gufo_enabled | bool else 'stopped' }}"
  when: gufo_model | length > 0 and not ansible_check_mode
