# llama-swap is the one endpoint on :8080. It starts the engine a request names,
# a Gufo container or llama-server, and stops what that model's group displaces.

- name: Check for the pinned Gufo image
  ansible.builtin.command: podman image exists {{ gufo_image | quote }}
  register: gufo_image_present
  changed_when: false
  failed_when: false
  check_mode: false

- name: Pull the pinned Gufo image
  ansible.builtin.command: podman pull {{ gufo_image | quote }}
  when: gufo_image_present.rc != 0
  changed_when: true

- name: Download llama-swap {{ llama_swap_version }}
  ansible.builtin.get_url:
    url: "https://github.com/mostlygeek/llama-swap/releases/download/v{{ llama_swap_version }}/llama-swap_{{ llama_swap_version }}_linux_amd64.tar.gz"
    dest: "/opt/llama-swap-{{ llama_swap_version }}.tar.gz"
    checksum: "sha256:{{ llama_swap_sha256 }}"
    mode: "0644"

- name: Unpack llama-swap {{ llama_swap_version }}
  ansible.builtin.unarchive:
    src: "/opt/llama-swap-{{ llama_swap_version }}.tar.gz"
    dest: /opt
    remote_src: true
    creates: "/opt/llama-swap-{{ llama_swap_version }}/llama-swap"
    extra_opts: ["--one-top-level=llama-swap-{{ llama_swap_version }}"]
  when: not ansible_check_mode

- name: Put this llama-swap version on PATH
  ansible.builtin.file:
    src: "/opt/llama-swap-{{ llama_swap_version }}/llama-swap"
    dest: /usr/local/bin/llama-swap
    state: link
    force: true
  when: not ansible_check_mode
  notify: Restart llama-swap

# Neither llama-swap nor the engines authenticate, so the port binds to the
# tailnet address only, never the LAN. The tailnet policy decides who reaches it.
# The Gufo image runs as its own non-root user. Its documented command is
# rootless podman with --group-add keep-groups, which carries your GPU groups
# into the container; rootful podman has no keep-groups, so without the host's
# render and video GIDs the engine cannot open /dev/kfd and reports
# "no ROCm-capable device is detected". The GIDs differ per host, so read them.
- name: Read the GPU device groups
  ansible.builtin.getent:
    database: group
    key: "{{ item }}"
  loop: [render, video]
  register: inference_gpu_group_lookup
  tags: [diagnose]

- name: Remember the GPU device group IDs
  ansible.builtin.set_fact:
    inference_gpu_gids: >-
      {{ inference_gpu_group_lookup.results
         | map(attribute='ansible_facts.getent_group') | map('dict2items') | map('first')
         | map(attribute='value') | map(attribute=1) | list }}
  tags: [diagnose]

# What the engine itself sees: GPU, gfx target, driver, memory. Only on
# request: ansible/play inference --tags diagnose
- name: Run gufo diagnose in the serving container setup
  ansible.builtin.command:
    argv: "{{ ['/usr/bin/podman', 'run', '--rm', '--device', '/dev/kfd', '--device', '/dev/dri']
              + (inference_gpu_gids | map('regex_replace', '^', '--group-add=') | list)
              + ['--ulimit', 'memlock=-1:-1', '-v', inference_models_dir ~ ':/models:ro']
              + gufo_podman_args + [gufo_image, 'gufo', 'diagnose'] }}"
  register: gufo_diagnose
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [never, diagnose]

- name: Gufo diagnose output
  ansible.builtin.debug:
    msg: "{{ (gufo_diagnose.stdout_lines + gufo_diagnose.stderr_lines) }}"
  tags: [never, diagnose]

- name: Read the tailnet address
  ansible.builtin.command: tailscale ip -4
  register: inference_tailnet_ip_cmd
  changed_when: false
  check_mode: false

- name: Remember the tailnet address
  ansible.builtin.set_fact:
    inference_tailnet_ip: "{{ inference_tailnet_ip_cmd.stdout | trim }}"

- name: Create the llama-swap config directory
  ansible.builtin.file:
    path: /etc/llama-swap
    state: directory
    mode: "0755"

# llama-swap reads this file once at start (it reloads on change only with
# -watch-config), so a change restarts it. That unloads any running model.
- name: Write the llama-swap model config
  ansible.builtin.template:
    src: llama-swap.yaml.j2
    dest: /etc/llama-swap/config.yaml
    mode: "0644"
  notify: Restart llama-swap

- name: Install the llama-swap service
  ansible.builtin.template:
    src: llama-swap.service.j2
    dest: /etc/systemd/system/llama-swap.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart llama-swap

# Before llama-swap: a single Gufo quadlet held :8080.
- name: Remove the old standalone Gufo quadlet
  ansible.builtin.file:
    path: /etc/containers/systemd/gufo.container
    state: absent
  notify: Reload systemd

- name: Restart llama-swap on request (-e llama_swap_restart=true)
  ansible.builtin.debug:
    msg: Restarting llama-swap as asked; running models are unloaded.
  changed_when: true
  notify: Restart llama-swap
  when: llama_swap_restart | bool

- name: Apply unit changes
  ansible.builtin.meta: flush_handlers

- name: Run llama-swap to match llama_swap_enabled
  ansible.builtin.systemd_service:
    name: llama-swap.service
    state: "{{ 'started' if llama_swap_enabled | bool else 'stopped' }}"
    enabled: "{{ llama_swap_enabled | bool }}"
  when: not ansible_check_mode
