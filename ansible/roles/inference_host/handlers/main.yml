- name: Update grub
  ansible.builtin.command: update-grub
  changed_when: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart llama-swap
  ansible.builtin.systemd_service:
    name: llama-swap.service
    state: restarted
  when: llama_swap_enabled | bool and not ansible_check_mode
