# Run through ./play, which passes the Tailscale SSH check before Ansible
# starts. See docs/inference-host.md.
[defaults]
inventory = inventory/tailnet.py
roles_path = roles
interpreter_python = auto_silent
callback_result_format = yaml
# The hosts are reached through the <name>-admin aliases that lab-ssh-config
# writes, so the user and known_hosts file come from ~/.ssh/config.d/lab.
host_key_checking = True

# No become_ask_pass: lab targets give the admin account passwordless sudo
# (role lab_target). The first run on a new target needs -K for the password.

[ssh_connection]
pipelining = True
