# The EVO-X2 during the model bake-off (2026-10). The three candidates and why
# are in the vault note "EVO-X2 inference server".

inference_gpu_users:
  - "{{ lookup('env', 'USER') }}"

# Revisions are the ones Gufo's own model guides pin. Qwen3.6 35B-A3B, the third
# candidate, is not pinned yet.
inference_models:
  - name: qwen3.8-flash-next
    repo: unsloth/Qwen3.8-Flash-Next-GGUF
    revision: 38bb39ee97821de2c9009abb7e93950eec396e66
    include:
      - "UD-Q4_K_XL/*"                                  # 4 shards, ~103.5 GiB
      - "MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf"   # 2.5 GiB draft head
  - name: qwen3.8-27b
    repo: unsloth/Qwen3.8-27B-GGUF
    revision: 4ca720788d1e01f1bff70c033e0d0028fd02e502
    include:
      - "Qwen3.8-27B-UD-Q8_K_XL.gguf"                   # 29.2 GiB
  - name: qwen3.8-27b-dflash2
    repo: z-lab/Qwen3.8-27B-DFlash2-GGUF
    revision: 2d9571f8ce46e151f61c6499c99dee6079e1d610
    include:
      - "Qwen3.8-27B-DFlash2-Q4_K_M.gguf"

# Flash-Next with the MTP draft, 2 sessions. Off until the llama.cpp baseline
# and the 30-minute thermal test pass (setup steps 6 and 7).
gufo_enabled: false
gufo_model: qwen3.8-flash-next/UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf
gufo_args:
  - --speculative mtp
  - --mtp-model /models/qwen3.8-flash-next/MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
  - --sessions 2
  - --context 131072
