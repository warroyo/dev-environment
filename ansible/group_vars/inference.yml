# The EVO-X2 during the model bake-off (2026-10). The three candidates and why
# are in the vault note "EVO-X2 inference server".

inference_gpu_users:
  - "{{ lookup('env', 'USER') }}"

# The Qwen3.8 revisions are the ones Gufo's own model guides pin. Qwen3.6
# 35B-A3B is not a Gufo model, so it runs on the llama.cpp build; its GGUF
# carries the MTP head.
inference_models:
  - name: qwen3.8-flash-next
    repo: unsloth/Qwen3.8-Flash-Next-GGUF
    revision: 38bb39ee97821de2c9009abb7e93950eec396e66
    include:
      - "UD-Q4_K_XL/*"                                  # 4 shards, ~103.5 GiB
      - "MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf"   # 2.5 GiB draft head
  - name: qwen3.8-27b
    repo: unsloth/Qwen3.8-27B-GGUF
    revision: 4ca720788d1e01f1bff70c033e0d0028fd02e502
    include:
      - "Qwen3.8-27B-UD-Q8_K_XL.gguf"                   # 29.2 GiB
  - name: qwen3.8-27b-dflash2
    repo: z-lab/Qwen3.8-27B-DFlash2-GGUF
    revision: 2d9571f8ce46e151f61c6499c99dee6079e1d610
    include:
      - "Qwen3.8-27B-DFlash2-Q4_K_M.gguf"
  - name: qwen3.6-35b-a3b
    repo: unsloth/Qwen3.6-35B-A3B-MTP-GGUF
    revision: 5bc3e238d916f48a861bac2f8a1990a0e9b7e98d
    include:
      - "Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf"               # 21.2 GiB

# What llama-swap serves. Clients send these names as `model`.
# Flash-Next fills the box, so it runs alone. The two small models fit together
# (~31 + ~21 GiB of weights) and stay loaded side by side.
llama_swap_groups:
  big:
    swap: true
    exclusive: true
  small:
    swap: false
    exclusive: true

# served_name: the id Gufo serves a model under (its /v1/models), taken from
# the GGUF and not settable on the command line. llama-swap rewrites the
# request's model to it (useModelName); without it Gufo answers model_not_found.
llama_swap_models:
  qwen3.8-flash-next:
    engine: gufo
    group: big
    served_name: Qwen3.8 Flash Next
    model: qwen3.8-flash-next/UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf
    args:
      - --speculative mtp
      - --mtp-model /models/qwen3.8-flash-next/MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
      - --sessions 2
      - --context 131072
  qwen3.8-27b:
    engine: gufo
    group: small
    served_name: Qwen3.8-27B
    model: qwen3.8-27b/Qwen3.8-27B-UD-Q8_K_XL.gguf
    args:
      - --speculative dflash2
      - --dflash-model /models/qwen3.8-27b-dflash2/Qwen3.8-27B-DFlash2-Q4_K_M.gguf
      - --sessions 2
      - --context 65536
  qwen3.6-35b-a3b:
    engine: llama.cpp
    group: small
    model: qwen3.6-35b-a3b/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
    args:
      - --spec-type draft-mtp
      - --parallel 2
      - --ctx-size 131072
      - --jinja

# Flash-Next is the working model until the bake-off picks one (2026-10-25):
# loaded when llama-swap starts, so the first request does not wait for it.
# Requests for another model still swap it out.
llama_swap_preload:
  - qwen3.8-flash-next

# Units whose state node_exporter exports, on top of node_metrics_units.
node_metrics_extra_units:
  - llama-swap.service
  - llama-engine-metrics.service
